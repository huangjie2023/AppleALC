name: Build AppleALC slim (CX8400)

on:
  push:
    branches: [ sf313-slim, sf313-cx8400-88 ]
  workflow_dispatch:

env:
  PROJECT_TYPE: KEXT

jobs:
  build:
    name: Build (x86_64 Release)
    runs-on: macos-latest
    env:
      JOB_TYPE: BUILD
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: CI Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh) && eval "$src" || exit 1

      - name: Lilu Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/Lilu/master/Lilu/Scripts/bootstrap.sh) && eval "$src" || exit 1

      - name: Verify resources are CX8400 only
        run: |
          echo "--- Resources content ---"
          ls -p Resources
          echo "--- codec dirs ---"
          ls -p Resources | grep / | tr '\n' ' '; echo
          if [ "$(ls -p Resources | grep / | grep -v '\.kext/' | wc -l)" -ne 1 ]; then
            echo "expected exactly 1 codec directory"; exit 1
          fi
          if [ ! -d Resources/PinConfigs.kext ]; then
            echo "Resources/PinConfigs.kext missing"; exit 1
          fi
          echo "--- PinConfigs entries ---"
          /usr/libexec/PlistBuddy -c "Print :IOKitPersonalities:as.vit9696.AppleALC:HDAConfigDefault" Resources/PinConfigs.kext/Contents/Info.plist 2>/dev/null | head -4
          echo "--- layout88 LayoutID ---"
          grep -A1 'LayoutID' Resources/CX8400/layout88.xml | head -4
          echo "--- Platforms88 input pin ---"
          grep -A1 'NodeID' Resources/CX8400/Platforms88.xml | grep integer | head -6

      - name: Build
        run: xcodebuild -jobs 1 -configuration Release -arch x86_64

      - name: Verify packed resources
        run: |
          echo "--- packed zlib in repo tree ---"
          ls -l Resources/CX8400/*.zlib
          echo "--- generated resources ---"
          ls -l AppleALC/kern_resources.cpp
          echo "--- codec entries embedded ---"
          grep -c 'CodecModInfo::File' AppleALC/kern_resources.cpp || true
          echo "--- binary size ---"
          ls -l build/Release/AppleALC.kext/Contents/MacOS/AppleALC 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleALC-slim
          path: build/*/*.zip
